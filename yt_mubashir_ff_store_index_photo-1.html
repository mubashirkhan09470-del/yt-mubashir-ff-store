<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YT_MUBASHIR FF STORE</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--card:#141d33;--line:#2b3855;--text:#f4f7ff;--muted:#aebbd3;--accent:#ffb020}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:linear-gradient(160deg,#101a35,#090d18);color:var(--text)}header{padding:22px 16px;text-align:center;background:#111a2c;border-bottom:1px solid var(--line)}h1{font-size:clamp(22px,5vw,32px);margin:0;color:var(--accent)}header p{margin:7px 0 0;color:var(--muted)}main{max-width:1000px;margin:auto;padding:16px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer;background:var(--accent);color:#151515}button.secondary{background:#263652;color:white;border:1px solid #405170}button.danger{background:#8f2937;color:white}.panel{background:#141d33;border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}.hidden{display:none!important}h2{margin:0 0 13px;font-size:21px}label{display:block;font-size:14px;color:var(--muted);margin:10px 0 5px}input,textarea{width:100%;padding:12px;border:1px solid #405170;background:#0b1222;color:white;border-radius:9px;font:inherit}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}.status,.small{font-size:14px;color:var(--muted);margin:10px 0;overflow-wrap:anywhere}.listings{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.listing{background:#111a2d;border:1px solid var(--line);border-radius:14px;overflow:hidden}.listing img,.no-photo{width:100%;height:210px;display:block;object-fit:cover;background:#080d18}.no-photo{display:flex;align-items:center;justify-content:center;color:#aebbd3}.listing-body{padding:13px}.listing h3{margin:0 0 8px;font-size:18px;overflow-wrap:anywhere}.price{font-weight:800;color:var(--accent);font-size:19px}.listing p{color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}.listing-actions{display:flex;gap:8px;flex-wrap:wrap}.listing-actions a{display:inline-block;text-decoration:none;color:white;background:#1d7955;padding:9px 12px;border-radius:8px;font-weight:700}@media(max-width:520px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}main{padding:12px}.panel{padding:13px}}
</style></head><body>
<header><h1>YT_MUBASHIR FF STORE</h1><p>Free Fire ID Listings · View &amp; Contact</p></header><main>
<div class="actions"><button id="loginOpen">Admin Login</button><a id="contactTop" href="#" style="text-decoration:none"><button class="secondary" type="button">Contact Seller</button></a></div><div id="status" class="status">Connecting to Firebase…</div>
<section id="loginPanel" class="panel hidden"><h2>Admin Login</h2><label for="email">Email</label><input id="email" type="email" autocomplete="username" placeholder="Admin email"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Password"><div class="actions"><button id="loginBtn">Login</button><button id="resetBtn" class="secondary" type="button">Forgot Password?</button><button id="loginClose" class="secondary" type="button">Close</button></div><div id="loginMessage" class="status"></div></section>
<section id="adminPanel" class="panel hidden"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><h2 id="formHeading">Add New ID</h2><button id="logoutBtn" class="secondary" type="button">Logout</button></div><form id="listingForm"><div class="grid"><div><label for="gameId">Free Fire ID / Listing title</label><input id="gameId" required maxlength="100" placeholder="Listing title or ID"></div><div><label for="price">Price (₹)</label><input id="price" required maxlength="40" placeholder="Example: 1500"></div><div class="wide"><label for="photoUrl">Photo URL (direct image link)</label><input id="photoUrl" type="url" placeholder="https://.../photo.jpg"><div class="small">Direct image links work best. A link to a webpage may not show the photo.</div></div><div class="wide"><div id="previewWrap" class="hidden"><label>Photo preview</label><img id="preview" alt="Photo preview" style="width:100%;max-height:260px;object-fit:contain;background:#080d18;border-radius:10px"></div></div><div class="wide"><label for="details">Details (optional)</label><textarea id="details" rows="3" maxlength="1000" placeholder="Listing details"></textarea></div></div><div class="actions"><button id="saveBtn" type="submit">Save ID</button><button id="cancelEdit" class="secondary hidden" type="button">Cancel edit</button></div><div id="formMessage" class="status"></div></form></section>
<section><h2>Available IDs</h2><div id="listings" class="listings"><div class="panel">Loading listings…</div></div></section><p class="small">Never share account passwords, OTPs, or recovery codes.</p></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,sendPasswordResetEmail,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,addDoc,getDocs,query,orderBy,serverTimestamp,deleteDoc,doc,updateDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyA0Q83TSWbeZEPJaojLQqbhJ1rv2VZGyKY",authDomain:"yt-mubashir-ff-store.firebaseapp.com",projectId:"yt-mubashir-ff-store",storageBucket:"yt-mubashir-ff-store.firebasestorage.app",messagingSenderId:"341248765560",appId:"1:341248765560:web:62e86dc3a5455d4ba2c78d",measurementId:"G-017QT7BK2E"};
const ADMIN_UID="cGZ0Rwyr9dUWgazdUqWjZ8SyeJz1";const WHATSAPP_NUMBER="91XXXXXXXXXX";const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);const $=id=>document.getElementById(id);const say=(id,msg)=>$(id).textContent=msg;let user=null,editingId=null,items=[];
$("contactTop").href="https://wa.me/"+WHATSAPP_NUMBER;$("loginOpen").onclick=()=>$("loginPanel").classList.toggle("hidden");$("loginClose").onclick=()=>$("loginPanel").classList.add("hidden");
$("loginBtn").onclick=async()=>{say("loginMessage","Logging in…");try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);say("loginMessage","Login successful.");}catch(e){say("loginMessage","Login failed: "+(e.code||e.message));}};
$("resetBtn").onclick=async()=>{let email=$("email").value.trim();if(!email)return say("loginMessage","Enter your registered email first.");try{await sendPasswordResetEmail(auth,email);say("loginMessage","If registered, a reset link was requested. Check Inbox and Spam.");}catch(e){say("loginMessage","Reset request failed: "+(e.code||e.message));}};
$("logoutBtn").onclick=()=>signOut(auth);$("photoUrl").addEventListener("input",()=>{let url=$("photoUrl").value.trim();$("previewWrap").classList.toggle("hidden",!url);if(url){$("preview").src=url;$("preview").onerror=()=>say("formMessage","Preview failed. Use a direct image URL.");$("preview").onload=()=>say("formMessage","Photo preview loaded.");}else{$("preview").removeAttribute("src");say("formMessage","");}});
function resetForm(){editingId=null;$("listingForm").reset();$("formHeading").textContent="Add New ID";$("saveBtn").textContent="Save ID";$("cancelEdit").classList.add("hidden");$("previewWrap").classList.add("hidden");say("formMessage","");}$("cancelEdit").onclick=resetForm;
onAuthStateChanged(auth,u=>{user=u;$("adminPanel").classList.toggle("hidden",!(u&&u.uid===ADMIN_UID));say("status",u&&u.uid!==ADMIN_UID?"Logged in, but this account is not configured as admin.":u?"Firebase connected · Admin logged in.":"Firebase connected · Public listings are visible.");loadListings();});
async function loadListings(){try{let s=await getDocs(query(collection(db,"listings"),orderBy("createdAt","desc")));items=s.docs.map(d=>({id:d.id,...d.data()}));render();}catch(e){try{let s=await getDocs(collection(db,"listings"));items=s.docs.map(d=>({id:d.id,...d.data()}));render();}catch(err){$("listings").textContent="Could not load listings. Check Firestore rules and connection.";say("status","Firestore error: "+(err.code||err.message));}}}
function render(){let root=$("listings");root.replaceChildren();if(!items.length){let n=document.createElement("div");n.className="panel";n.textContent="No IDs listed yet.";root.append(n);return;}for(let x of items){let c=document.createElement("article");c.className="listing";let url=x.photoUrl||x.photo||x.imageUrl;if(url){let img=document.createElement("img");img.loading="lazy";img.alt=x.title||x.gameId||"Listing photo";img.src=url;img.onerror=()=>{let n=document.createElement("div");n.className="no-photo";n.textContent="Photo could not load";img.replaceWith(n)};c.append(img)}else{let n=document.createElement("div");n.className="no-photo";n.textContent="No photo added";c.append(n)}let b=document.createElement("div");b.className="listing-body";let h=document.createElement("h3");h.textContent=x.title||x.gameId||"Free Fire ID";b.append(h);let p=document.createElement("div");p.className="price";p.textContent=x.price?"₹"+String(x.price).replace(/^₹/,""):"Price on request";b.append(p);if(x.details){let d=document.createElement("p");d.textContent=x.details;b.append(d)}let a=document.createElement("div");a.className="listing-actions";let contact=document.createElement("a");contact.href="https://wa.me/"+WHATSAPP_NUMBER+"?text="+encodeURIComponent("Hi, I want to ask about: "+(x.title||x.gameId||"Free Fire ID"));contact.target="_blank";contact.rel="noopener";contact.textContent="Contact Seller";a.append(contact);if(user&&user.uid===ADMIN_UID){let edit=document.createElement("button");edit.className="secondary";edit.textContent="Edit";edit.onclick=()=>startEdit(x);a.append(edit);let del=document.createElement("button");del.className="danger";del.textContent="Delete";del.onclick=async()=>{if(confirm("Delete this listing?"))try{await deleteDoc(doc(db,"listings",x.id));await loadListings()}catch(e){alert("Delete failed: "+(e.code||e.message))}};a.append(del)}b.append(a);c.append(b);root.append(c)}}
function startEdit(x){editingId=x.id;$("gameId").value=x.title||x.gameId||"";$("price").value=x.price||"";$("photoUrl").value=x.photoUrl||x.photo||x.imageUrl||"";$("details").value=x.details||"";$("formHeading").textContent="Edit Listing";$("saveBtn").textContent="Update ID";$("cancelEdit").classList.remove("hidden");$("adminPanel").scrollIntoView({behavior:"smooth"});$("photoUrl").dispatchEvent(new Event("input"))}
$("listingForm").addEventListener("submit",async e=>{e.preventDefault();if(!user||user.uid!==ADMIN_UID)return say("formMessage","Only the configured admin can save listings.");let title=$("gameId").value.trim(),price=$("price").value.trim(),photoUrl=$("photoUrl").value.trim(),details=$("details").value.trim();if(photoUrl&&!/^https?:\/\//i.test(photoUrl))return say("formMessage","Photo URL must start with http:// or https://");let data={title,gameId:title,price,photoUrl,photo:photoUrl,details,updatedAt:serverTimestamp()};say("formMessage","Saving…");$("saveBtn").disabled=true;try{if(editingId)await updateDoc(doc(db,"listings",editingId),data);else await addDoc(collection(db,"listings"),{...data,createdAt:serverTimestamp()});resetForm();await loadListings();say("formMessage","Listing saved successfully.");}catch(err){say("formMessage","Save failed: "+(err.code||err.message));}finally{$("saveBtn").disabled=false}});
loadListings();
</script></body></html>
